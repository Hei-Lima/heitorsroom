version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: heitorsroom-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migration.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - heitorsroom-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: heitorsroom-app
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      API_TOKEN: ${API_TOKEN}
    ports:
      - "80:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - heitorsroom-network
    restart: unless-stopped

networks:
  heitorsroom-network:
    driver: bridge

volumes:
  postgres_data: